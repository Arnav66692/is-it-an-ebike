<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>OWLv2 speed check</title></head>
<body>
<pre id="out">starting…</pre>
<script type="module">
// Photo pilot v3, step 1. Times OWLv2 on three dev photos after one warm-up run.
// The download and model load are timed separately and are not part of the per-photo mean.
const out = document.getElementById("out");
const params = new URLSearchParams(location.search);
const device = params.get("device") === "wasm" ? "wasm" : "webgpu";
const FILES = { q8: "model_quantized.onnx", q4f16: "model_q4f16.onnx", fp16: "model_fp16.onnx" };
const dtype = FILES[params.get("dtype")] ? params.get("dtype") : "q8";
// Library versions, each pinned. 4.3.1 is the original. The older ones only change the onnxruntime-web build.
const LIBS = {
  "4.3.1": "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1/+esm",
  "4.2.0": "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0/+esm",
  "3.8.1": "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1/dist/transformers.min.js",
};
const lib = LIBS[params.get("lib")] ? params.get("lib") : "4.3.1";
// threads=hc runs WASM on navigator.hardwareConcurrency threads. It needs a cross-origin isolated page.
const threads = device === "wasm" && params.get("threads") === "hc" ? "hc" : "1";
const MODEL = "Xenova/owlv2-base-patch16-ensemble";
const FILE_URL = "https://huggingface.co/" + MODEL + "/resolve/main/onnx/" + FILES[dtype];
const QUERIES = ["bicycle pedal", "pedal crank arm", "bicycle chain", "motorcycle foot peg"];
const PHOTOS = ["train/train_01.jpg", "train/train_02.jpg", "train/train_03.jpg"];
const result = { step: "photo pilot v3 speed check", device, model: MODEL, file: "onnx/" + FILES[dtype], dtype, library: `@huggingface/transformers ${lib}, ${LIBS[lib]}`, queries: QUERIES, browser: navigator.userAgent, cross_origin_isolated: self.crossOriginIsolated, started_at: new Date().toISOString() };
const saveName = (lib === "4.3.1" ? (dtype === "q8" ? `speed-${device}` : `speed-${dtype}-${device}`) : `speed-${dtype}-${device}-tjs${lib}${threads === "hc" ? "-mt" : ""}`) + ".json";
// The onnxruntime-web files the page actually fetched, so the record names the exact runtime build.
const ortFiles = () => [...new Set(performance.getEntriesByType("resource").map((e) => e.name).filter((n) => n.includes("onnxruntime")))];
async function cachedSize() {
  try {
    const c = await caches.open("transformers-cache");
    const r = await c.match(FILE_URL);
    if (!r) return null;
    return (await r.blob()).size;
  } catch {
    return null;
  }
}
try {
  if (device === "webgpu") {
    const a = await navigator.gpu?.requestAdapter();
    const info = a ? (a.info || {}) : {};
    result.adapter = a ? { vendor: info.vendor, architecture: info.architecture } : null;
  }
  result.model_cached_before = (await cachedSize()) !== null;
  const t0 = performance.now();
  const T = await import(LIBS[lib]);
  result.import_ms = Math.round(performance.now() - t0);
  if (threads === "hc") {
    const w = T.env?.backends?.onnx?.wasm;
    if (!w) throw new Error("no onnx wasm settings to set threads on");
    w.numThreads = navigator.hardwareConcurrency;
    result.hardware_concurrency = navigator.hardwareConcurrency;
    result.num_threads = w.numThreads;
  }
  out.textContent = "loading model…";
  const t1 = performance.now();
  const detector = await T.pipeline("zero-shot-object-detection", MODEL, { dtype, device });
  result.load_ms = Math.round(performance.now() - t1);
  result.load_includes_download = !result.model_cached_before;
  result.ort_files = ortFiles();
  result.download_bytes = await cachedSize();
  out.textContent = "warming up…";
  const url = (p) => new URL(p, location.href).href;
  const tw = performance.now();
  await detector(url(PHOTOS[0]), QUERIES);
  result.warmup_ms = Math.round(performance.now() - tw);
  result.per_photo = [];
  for (const p of PHOTOS) {
    const t = performance.now();
    const dets = await detector(url(p), QUERIES);
    const ms = performance.now() - t;
    const best = Object.fromEntries(QUERIES.map((q) => [q, 0]));
    for (const d of dets) best[d.label] = Math.max(best[d.label], d.score);
    result.per_photo.push({ photo: p, ms: Math.round(ms), detections: dets.length, top_scores: best });
    out.textContent = `timed ${result.per_photo.length}/3`;
  }
  result.mean_ms = Math.round(result.per_photo.reduce((s, r) => s + r.ms, 0) / result.per_photo.length);
  result.stop_rule = "mean over 15000 ms stops v3";
  result.over_15s = result.mean_ms > 15000;
  result.finished_at = new Date().toISOString();
  const saved = await (await fetch(`http://127.0.0.1:8792/${saveName}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(result, null, 1) })).json();
  out.textContent = "DONE " + JSON.stringify({ device, load_ms: result.load_ms, warmup_ms: result.warmup_ms, per_photo_ms: result.per_photo.map((r) => r.ms), mean_ms: result.mean_ms, saved });
} catch (e) {
  result.error = String(e && e.stack ? e.stack : e);
  result.ort_files = ortFiles();
  result.finished_at = new Date().toISOString();
  try {
    await fetch(`http://127.0.0.1:8792/${saveName}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(result, null, 1) });
  } catch {}
  out.textContent = "ERROR " + result.error;
}
</script>
</body>
</html>
